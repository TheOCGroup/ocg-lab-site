<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCG LAB Playbook</title><style>body{font-family:system-ui;background:#07111f;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.load{max-width:560px;padding:32px;text-align:center}.load b{font-size:24px}.load p{color:#a7b7cb}</style></head><body><div class="load"><b>Opening your OCG LAB Playbook…</b><p id="msg">Loading the interactive experience.</p></div><script>
(async()=>{const p=new URLSearchParams(location.search).get('p');const allowed=new Set(['insurance-agent','content-creator','diy-home-improvement','digital-marketer','youtube-creator','videographer','candle-maker','real-estate-investor','airbnb-str','midterm-rental','property-management','sommelier','gamer-streaming']);if(!allowed.has(p)){document.getElementById('msg').textContent='Playbook not found.';return;}try{await new Promise((res,rej)=>{const s=document.createElement('script');s.src='/playbook-router/'+p+'.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});const bin=Uint8Array.from(atob(window.PLAYBOOK_DATA),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Please update your browser to open this playbook.');const ds=new DecompressionStream('gzip');const txt=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(txt);document.close();}catch(e){document.getElementById('msg').textContent=e.message||'Unable to open playbook.';}})();
</script></body></html>
