name: LeadFlow Product QA

on:
  pull_request:
    paths:
      - 'leadflow-ai-pro/**'
      - 'playbooks/leadflow/**'
      - '.github/workflows/leadflow-product-qa.yml'
  workflow_dispatch:

concurrency:
  group: leadflow-product-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/leadflow-http.log 2>&1 &
          sleep 2
      - name: Run LeadFlow end-to-end product QA
        shell: bash
        run: |
          set -o pipefail
          node leadflow-ai-pro/qa-product.mjs | tee leadflow-ai-pro/qa-result.json
      - name: Run proactive training coach QA
        shell: bash
        run: |
          set -o pipefail
          node leadflow-ai-pro/qa-guided-training.mjs | tee leadflow-ai-pro/qa-training-result.json
      - name: Run full render and flow QA
        shell: bash
        run: |
          set -o pipefail
          node leadflow-ai-pro/qa-render-flow.mjs | tee leadflow-ai-pro/qa-flow-result.json
      - name: Run LeadFlow playbook QA
        shell: bash
        run: |
          set -o pipefail
          node leadflow-ai-pro/qa-playbook.mjs | tee leadflow-ai-pro/qa-playbook-result.json
      - name: Run Live AI boundary contract QA
        shell: bash
        run: |
          set -o pipefail
          node leadflow-ai-pro/qa-live-ai-contract.mjs | tee leadflow-ai-pro/qa-live-ai-result.json
      - name: Run Live AI fail-closed browser QA
        shell: bash
        run: |
          set -o pipefail
          node leadflow-ai-pro/qa-live-ai-browser.mjs | tee leadflow-ai-pro/qa-live-ai-browser-result.json
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadflow-product-qa
          path: |
            leadflow-ai-pro/qa-result.json
            leadflow-ai-pro/qa-desktop.png
            leadflow-ai-pro/qa-mobile.png
            leadflow-ai-pro/qa-training-result.json
            leadflow-ai-pro/qa-training-desktop.png
            leadflow-ai-pro/qa-training-mobile.png
            leadflow-ai-pro/qa-flow-result.json
            leadflow-ai-pro/qa-flow-desktop.png
            leadflow-ai-pro/qa-flow-mobile.png
            leadflow-ai-pro/qa-playbook-result.json
            leadflow-ai-pro/qa-live-ai-result.json
            leadflow-ai-pro/qa-live-ai-browser-result.json
            leadflow-ai-pro/qa-playbook-desktop.png
            leadflow-ai-pro/qa-playbook-mobile.png
            leadflow-ai-pro/qa-playbook-desktop-spread-*.png
            leadflow-ai-pro/qa-playbook-mobile-spread-*.png
          if-no-files-found: warn
          retention-days: 7
