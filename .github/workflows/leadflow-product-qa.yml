name: LeadFlow Product QA

on:
  pull_request:
    paths:
      - 'leadflow-ai-pro/**'
      - '.github/workflows/leadflow-product-qa.yml'
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/leadflow-http.log 2>&1 &
          sleep 2
      - name: Run LeadFlow end-to-end product QA
        run: node leadflow-ai-pro/qa-product.mjs | tee leadflow-ai-pro/qa-result.json
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadflow-product-qa
          path: |
            leadflow-ai-pro/qa-result.json
            leadflow-ai-pro/qa-desktop.png
            leadflow-ai-pro/qa-mobile.png
          if-no-files-found: warn
