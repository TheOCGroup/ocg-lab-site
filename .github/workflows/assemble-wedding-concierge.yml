name: Assemble Wedding Concierge

on:
  push:
    branches:
      - release/wedding-concierge-v6-8
    paths:
      - '.release/wedding/**'
      - '.github/workflows/assemble-wedding-concierge.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble exact approved artifact
        shell: bash
        run: |
          mkdir -p wedding-destination-concierge
          base64 -d .release/wedding/artifact.b64 \
            | gzip -d > wedding-destination-concierge/index.html
          echo "ca0bd76f7a0162bd2cd717c15a89e916706cbd9f7340edab5851fc5584ac98b2  wedding-destination-concierge/index.html" | sha256sum -c -
          test "$(wc -c < wedding-destination-concierge/index.html)" -eq 232638
      - name: Commit assembled release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wedding-destination-concierge/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Assemble exact Wedding Concierge release [skip ci]"
          git push
