name: OCG LAB OS CI

on:
  pull_request:
    paths:
      - 'os/source/**'
      - 'os/index.html'
      - 'os/assets/**'
      - 'os/favicon.*'
      - 'api/os/sync.js'
      - '.github/workflows/ocg-lab-os-ci.yml'
      - '.github/workflows/ocg-lab-os-promote.yml'
  push:
    branches:
      - main
    paths:
      - 'os/source/**'
      - 'os/index.html'
      - 'os/assets/**'
      - 'os/favicon.*'
      - 'api/os/sync.js'
      - '.github/workflows/ocg-lab-os-ci.yml'
      - '.github/workflows/ocg-lab-os-promote.yml'

concurrency:
  group: ocg-lab-os-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: os/source
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/source/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Scan generated bundle for client-side secrets
        run: node scripts/scan-production-bundle.mjs dist
      - name: Upload generated OS bundle for parity repair
        uses: actions/upload-artifact@v4
        with:
          name: ocg-lab-os-generated
          path: os/source/dist
          if-no-files-found: error
          retention-days: 1
      - name: Verify checked-in /os matches canonical source build
        run: node scripts/check-production-parity.mjs
      - name: Scan checked-in production bundle
        run: node scripts/scan-production-bundle.mjs ..
