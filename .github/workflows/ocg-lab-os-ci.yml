name: OCG LAB OS CI

on:
  pull_request:
    paths:
      - 'os/source/**'
      - 'os/index.html'
      - 'os/assets/**'
      - 'os/favicon.*'
      - 'api/os/sync.js'
      - '.github/workflows/ocg-lab-os-ci.yml'
      - '.github/workflows/ocg-lab-os-promote.yml'
  push:
    branches:
      - main
      - fix/os-production-parity-security
    paths:
      - 'os/source/**'
      - 'os/index.html'
      - 'os/assets/**'
      - 'os/favicon.*'
      - 'api/os/sync.js'
      - '.github/workflows/ocg-lab-os-ci.yml'
      - '.github/workflows/ocg-lab-os-promote.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: os/source
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/source/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Scan generated bundle for client-side secrets
        run: node scripts/scan-production-bundle.mjs dist
      - name: Verify checked-in /os matches canonical source build
        run: node scripts/check-production-parity.mjs
      - name: Scan checked-in production bundle
        run: node scripts/scan-production-bundle.mjs ..

  promote-repair-branch:
    if: github.event_name == 'push' && github.ref_name == 'fix/os-production-parity-security'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/source/package-lock.json
      - name: Install, test, typecheck and build
        working-directory: os/source
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lint
          npm run build
          node scripts/scan-production-bundle.mjs dist
      - name: Promote canonical source build
        run: |
          rm -rf os/assets
          cp -R os/source/dist/assets os/assets
          cp os/source/dist/index.html os/index.html
          cp os/source/dist/favicon.* os/ 2>/dev/null || true
      - name: Verify promoted assets
        working-directory: os/source
        run: |
          node scripts/check-production-parity.mjs
          node scripts/scan-production-bundle.mjs ..
      - name: Commit generated production bundle
        run: |
          if git diff --quiet -- os/index.html os/assets os/favicon.ico os/favicon.png; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A os/index.html os/assets os/favicon.ico os/favicon.png
          git commit -m 'build(os): promote canonical source to production assets'
          git push origin HEAD:fix/os-production-parity-security
