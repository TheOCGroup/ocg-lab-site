name: OCG LAB OS CI

on:
  pull_request:
    paths:
      - 'os/source/**'
      - 'os/index.html'
      - 'os/assets/**'
      - 'os/favicon.*'
      - 'api/os/sync.js'
      - '.github/workflows/ocg-lab-os-ci.yml'
      - '.github/workflows/ocg-lab-os-promote.yml'
  push:
    branches:
      - main
    paths:
      - 'os/source/**'
      - 'os/index.html'
      - 'os/assets/**'
      - 'os/favicon.*'
      - 'api/os/sync.js'
      - '.github/workflows/ocg-lab-os-ci.yml'
      - '.github/workflows/ocg-lab-os-promote.yml'

permissions:
  contents: write

concurrency:
  group: ocg-lab-os-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: os/source
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/source/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Scan generated bundle for client-side secrets
        run: node scripts/scan-production-bundle.mjs dist
      - name: Synchronize checked-in production bundle
        run: |
          rm -rf ../assets
          cp -R dist/assets ../assets
          cp dist/index.html ../index.html
          if [ -f dist/favicon.svg ]; then cp dist/favicon.svg ../favicon.svg; fi
          if [ -f dist/favicon.ico ]; then cp dist/favicon.ico ../favicon.ico; fi
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add os/index.html os/assets os/favicon.svg os/favicon.ico 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Production bundle already synchronized."
          else
            git commit -m "build(os): synchronize technology department bundle"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Verify checked-in /os matches canonical source build
        run: node scripts/check-production-parity.mjs
      - name: Scan checked-in production bundle
        run: node scripts/scan-production-bundle.mjs ..
