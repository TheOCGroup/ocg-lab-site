name: OCG LAB OS CI

on:
  pull_request:
    paths:
      - 'os/source/**'
      - '.github/workflows/ocg-lab-os-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'os/source/**'
      - '.github/workflows/ocg-lab-os-ci.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: os/source
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/source/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
