name: OCG LAB OS CI

on:
  pull_request:
    paths:
      - 'os/source/**'
      - 'os/index.html'
      - 'os/assets/**'
      - 'os/favicon.*'
      - 'api/os/sync.js'
      - 'tests/cloudflare-staging-sync.test.mjs'
      - 'services/ocg-os-read-gateway/**'
      - '.github/workflows/ocg-lab-os-ci.yml'
      - '.github/workflows/ocg-lab-os-promote.yml'
  push:
    branches:
      - main
    paths:
      - 'os/source/**'
      - 'os/index.html'
      - 'os/assets/**'
      - 'os/favicon.*'
      - 'api/os/sync.js'
      - 'services/ocg-os-read-gateway/**'
      - '.github/workflows/ocg-lab-os-ci.yml'
      - '.github/workflows/ocg-lab-os-promote.yml'

concurrency:
  group: ocg-lab-os-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: os/source
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/source/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Cloudflare staging API safety tests
        run: node --test ../../tests/cloudflare-staging-sync.test.mjs
      - name: Cloud Run read gateway safety tests
        run: node --test ../../services/ocg-os-read-gateway/*.test.mjs
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Scan generated bundle for client-side secrets
        run: node scripts/scan-production-bundle.mjs dist
      - name: Verify checked-in /os matches canonical source build
        if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'cloudflare-staging-only')
        run: node scripts/check-production-parity.mjs
      - name: Scan checked-in production bundle
        run: node scripts/scan-production-bundle.mjs ..
      - name: Verify staging-only build disables cloud writes
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'cloudflare-staging-only')
        env:
          VITE_CLOUD_SYNC_READ_ONLY: 'true'
        run: |
          npm run build
          node scripts/scan-production-bundle.mjs dist
          node -e "const fs=require('node:fs');const p=fs.readdirSync('dist/assets').find(x=>/^index-.*\.js$/.test(x));if(!p||!fs.readFileSync('dist/assets/'+p,'utf8').includes('Cloud writes disabled in this preview.'))process.exit(1);"
