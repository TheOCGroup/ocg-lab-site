name: Lender Product QA

on:
  pull_request:
    paths:
      - "playbooks/lender-ai-super-pro/**"
      - "lender-ai-super-pro/**"
      - "tests/lender-commercial-parity.test.mjs"
      - "tests/lender-recorder-contract.test.mjs"
      - "tests/lender-api-truth.test.mjs"
      - "tests/lender-memory-truth.test.mjs"
      - "tests/lender-failure-recovery.test.mjs"
      - "api/lender-ai-super-pro/**"
      - ".github/workflows/lender-product-qa.yml"
  push:
    branches: [main]
    paths:
      - "playbooks/lender-ai-super-pro/**"
      - "lender-ai-super-pro/**"
      - "tests/lender-commercial-parity.test.mjs"
      - "tests/lender-recorder-contract.test.mjs"
      - "tests/lender-api-truth.test.mjs"
      - "tests/lender-memory-truth.test.mjs"
      - "tests/lender-failure-recovery.test.mjs"
      - "api/lender-ai-super-pro/**"
      - ".github/workflows/lender-product-qa.yml"
  workflow_dispatch:

concurrency:
  group: lender-product-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lender-product-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Lender commercial, recorder, API, memory and failure-recovery truth invariants
        run: node --test tests/lender-commercial-parity.test.mjs tests/lender-recorder-contract.test.mjs tests/lender-api-truth.test.mjs tests/lender-memory-truth.test.mjs tests/lender-failure-recovery.test.mjs
