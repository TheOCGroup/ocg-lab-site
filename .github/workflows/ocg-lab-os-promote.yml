name: OCG LAB OS Promote Canonical Build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/os-production-parity-security
    paths:
      - 'os/source/**'
      - '.github/workflows/ocg-lab-os-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/source/package-lock.json
      - name: Install
        working-directory: os/source
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: os/source
        run: npm test
      - name: Typecheck
        working-directory: os/source
        run: npm run lint
      - name: Build
        working-directory: os/source
        run: npm run build
      - name: Scan generated bundle
        working-directory: os/source
        run: node scripts/scan-production-bundle.mjs dist
      - name: Promote canonical build into /os
        run: |
          rm -rf os/assets
          cp -R os/source/dist/assets os/assets
          cp os/source/dist/index.html os/index.html
          cp os/source/dist/favicon.* os/ 2>/dev/null || true
      - name: Verify production parity
        working-directory: os/source
        run: node scripts/check-production-parity.mjs
      - name: Scan promoted production bundle
        working-directory: os/source
        run: node scripts/scan-production-bundle.mjs ..
      - name: Commit promoted artifacts
        run: |
          if git diff --quiet -- os/index.html os/assets os/favicon.ico os/favicon.png; then
            echo 'Production assets already match canonical source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A os/index.html os/assets os/favicon.ico os/favicon.png
          git commit -m 'build(os): promote canonical source to production assets'
          git push origin HEAD:${{ github.ref_name }}
